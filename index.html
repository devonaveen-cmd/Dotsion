function attachFiles(subjectId, docId) {
  const input = el("input", { type: "file", multiple: true, style: "display:none" });
  input.accept = ".pdf,.txt,.md,.markdown,.docx,.png,.jpg,.jpeg,.webp,.gif,.csv,.json";
  input.addEventListener("change", async () => {
    const files = Array.from(input.files || []);
    for (const f of files) {
      const ext = (f.name.split(".").pop() || "").toLowerCase();
      if (ext === "md" || ext === "markdown" || ext === "txt") {
        const text = await readFileText(f);
        const html = ext === "txt" ? "<p>" + escapeHtml(text).replace(/\n{2,}/g, "</p><p>").replace(/\n/g, "<br>") + "</p>" : mdToHtml(text);
        const doc = await createDocument({ subjectId, title: f.name.replace(/\.[^.]+$/, ""), type: "doc", html });
        toast("Imported " + f.name, { kind: "ok" });
        if (files.length === 1) openDoc(doc.id);
      } else if (ext === "pdf") {
        const blob = await getRawBlob(f);
        await createAttachment({ subjectId, docId: docId || null, name: f.name, type: f.type || "application/pdf" }, blob);
        toast("Added PDF: " + f.name, { kind: "ok" });
      } else if (/^image\//.test(f.type) || ["png", "jpg", "jpeg", "webp", "gif"].includes(ext)) {
        const blob = await getRawBlob(f);
        await createAttachment({ subjectId, docId: docId || null, name: f.name, type: f.type || "image/" + ext }, blob);
        toast("Added image: " + f.name, { kind: "ok" });
      } else if (ext === "docx") {
        toast("DOCX is stored as an attachment (in-app rendering is limited)", { icon: "info" });
        const blob = await getRawBlob(f);
        await createAttachment({ subjectId, docId: docId || null, name: f.name, type: f.type }, blob);
      } else {
        const blob = await getRawBlob(f);
        await createAttachment({ subjectId, docId: docId || null, name: f.name, type: f.type }, blob);
      }
    }
    rerender();
  });
  document.body.appendChild(input); input.click(); setTimeout(() => input.remove(), 1000);
}
function getRawBlob(file) { return Promise.resolve(file); }

/* ---------- Research map ---------- */
function renderMapPage(subjectId) {
  const s = subjectById(subjectId);
  const wrap = el("div", { class: "page" });
  const head = el("div", { class: "section__head" });
  head.appendChild(el("h1", { class: "greet", style: "font-size:clamp(22px,6vw,30px)", text: "Research map" }));
  if (s) head.appendChild(el("a", { class: "btn btn--sm", href: "#/subject/" + s.id, text: s.name }));
  wrap.appendChild(head);

  const nodes = [];
  const links = [];
  const subjects = s ? [s] : State.subjects;
  subjects.forEach((sub) => {
    nodes.push({ id: "s:" + sub.id, kind: "subject", label: sub.name, ref: { type: "subject", id: sub.id } });
    docsOfSubject(sub.id).forEach((d) => { nodes.push({ id: "d:" + d.id, kind: "doc", label: d.title, ref: { type: "doc", id: d.id } }); links.push(["s:" + sub.id, "d:" + d.id]); });
    sourcesOfSubject(sub.id).forEach((x) => { nodes.push({ id: "src:" + x.id, kind: "source", label: x.title, ref: { type: "source", id: x.id } }); links.push(["s:" + sub.id, "src:" + x.id]); });
    experimentsOfSubject(sub.id).forEach((e) => { nodes.push({ id: "exp:" + e.id, kind: "experiment", label: e.title, ref: { type: "experiment", id: e.id } }); links.push(["s:" + sub.id, "exp:" + e.id]); });
    questionsOfSubject(sub.id).forEach((q) => { nodes.push({ id: "q:" + q.id, kind: "concept", label: q.text, ref: { type: "question", id: q.id } }); links.push(["s:" + sub.id, "q:" + q.id]); });
    State.claims.filter((c) => c.subjectId === sub.id).forEach((c) => { nodes.push({ id: "cl:" + c.id, kind: "claim", label: c.text, ref: { type: "claim", id: c.id } }); links.push(["s:" + sub.id, "cl:" + c.id]); });
  });
  State.links.forEach((l) => {
    const from = l.fromType === "subject" ? "s:" + l.fromId : (l.fromType === "doc" ? "d:" + l.fromId : (l.fromType === "source" ? "src:" + l.fromId : (l.fromType === "experiment" ? "exp:" + l.fromId : "cl:" + l.fromId)));
    const to = l.toType === "subject" ? "s:" + l.toId : (l.toType === "doc" ? "d:" + l.toId : (l.toType === "source" ? "src:" + l.toId : (l.toType === "experiment" ? "exp:" + l.toId : "cl:" + l.toId)));
    links.push([from, to]);
  });

  if (!nodes.length) { wrap.appendChild(emptyState("Nothing to map yet", "Add documents, sources and experiments to see relationships.", "map")); setMain(wrap); return; }

  // radial layout
  const W = Math.max(680, 220 + nodes.length * 26), H = 520;
  const cx = W / 2, cy = H / 2;
  const byKind = {};
  nodes.forEach((n) => { (byKind[n.kind] = byKind[n.kind] || []).push(n); });
  const kinds = Object.keys(byKind);
  let ring = 0;
  const pos = {};
  const centerNodes = byKind.subject || [];
  centerNodes.forEach((n, i) => { const a = (i / Math.max(1, centerNodes.length)) * Math.PI * 2; pos[n.id] = { x: cx + Math.cos(a) * 40, y: cy + Math.sin(a) * 40 }; });
  kinds.filter((k) => k !== "subject").forEach((k) => {
    ring++;
    const arr = byKind[k];
    const r = 90 + ring * 78;
    arr.forEach((n, i) => { const a = (i / Math.max(1, arr.length)) * Math.PI * 2 + ring * 0.5; pos[n.id] = { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }; });
  });

  const mapWrap = el("div", { class: "map-wrap" });
  const canvas = el("div", { class: "map-canvas", style: "width:" + W + "px;height:" + H + "px" });
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("class", "map-svg"); svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  links.forEach(([a, b]) => { if (!pos[a] || !pos[b]) return; const ln = document.createElementNS(svgNS, "line"); ln.setAttribute("x1", pos[a].x); ln.setAttribute("y1", pos[a].y); ln.setAttribute("x2", pos[b].x); ln.setAttribute("y2", pos[b].y); ln.setAttribute("stroke", "var(--border-2)"); ln.setAttribute("stroke-width", "1.2"); svg.appendChild(ln); });
  canvas.appendChild(svg);
  nodes.forEach((n) => {
    const p = pos[n.id]; if (!p) return;
    const node = el("button", { class: "map-node", dataset: { kind: n.kind }, style: "left:" + p.x + "px;top:" + p.y + "px", title: n.label, text: truncate(n.label, 26) });
    node.addEventListener("click", () => {
      if (n.ref.type === "doc") openDoc(n.ref.id);
      else if (n.ref.type === "experiment") Router.go("#/experiment/" + n.ref.id);
      else if (n.ref.type === "subject") Router.go("#/subject/" + n.ref.id);
      else if (n.ref.type === "source") Router.go("#/subject/" + (sourceById(n.ref.id) ? sourceById(n.ref.id).subjectId : "") + "/sources");
      else if (n.ref.type === "question") { const q = State.questions.find((x) => x.id === n.ref.id); if (q) openQuestionDetail(q); }
    });
    canvas.appendChild(node);
  });
  mapWrap.appendChild(canvas);
  wrap.appendChild(el("p", { class: "hint", style: "margin:10px 0" , text: "Relationships between subjects, documents, sources, experiments, claims and questions. Drag to pan." }));
  wrap.appendChild(mapWrap);
  setMain(wrap);
}

/* ==== ink.js ==== */
/* ============================================================
   Atelier — Ink / stylus annotation engine
   ============================================================ */

const Ink = {
  canvas: null, ctx: null, off: null, offctx: null, wrap: null, docId: null,
  dpr: 1, w: 0, h: 0,
  strokes: [], redo: [],
  selected: new Set(),
  tool: "pen", color: "#b0602e", width: 2.5, opacity: 1, pressure: true,
  drawing: false, cur: null, mode: null, start: null,
  lassoPts: null, moving: null, moveStart: null, offBase: null,
  active: false, onChange: null,

  init(canvas, wrap, docId, data) {
    this.canvas = canvas; this.wrap = wrap; this.docId = docId;
    this.ctx = canvas.getContext("2d");
    this.off = document.createElement("canvas");
    this.offctx = this.off.getContext("2d");
    this.strokes = (data && data.strokes) ? JSON.parse(JSON.stringify(data.strokes)) : [];
    this.redo = []; this.selected = new Set();
    this.color = State.settings.inkColor; this.width = State.settings.inkWidth;
    this.pressure = State.settings.inkPressure; this.tool = "pen";
    this.resize();
    this.bind();
    this.renderOff();
    this.paint();
  },

  resize() {
    if (!this.wrap || !this.canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    this.dpr = dpr;
    this.w = this.wrap.clientWidth;
    this.h = Math.max(this.wrap.scrollHeight, this.wrap.clientHeight);
    [this.canvas, this.off].forEach((c) => { c.width = Math.round(this.w * dpr); c.height = Math.round(this.h * dpr); });
    this.canvas.style.width = "100%"; this.canvas.style.height = "100%";
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.offctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.renderOff(); this.paint();
  },

  setActive(on) {
    this.active = on;
    if (this.canvas) { const layer = this.canvas.parentElement; if (layer) layer.dataset.active = String(on); }
  },

  bind() {
    const c = this.canvas;
    c.style.touchAction = "none";
    c.addEventListener("pointerdown", (e) => this.onDown(e));
    c.addEventListener("pointermove", (e) => this.onMove(e));
    c.addEventListener("pointerup", (e) => this.onUp(e));
    c.addEventListener("pointercancel", (e) => this.onUp(e));
    c.addEventListener("pointerleave", (e) => { if (this.drawing) this.onUp(e); });
  },

  pt(e) {
    const r = this.canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pressure > 0 && e.pointerType !== "mouse" ? e.pressure : 0.5 };
  },

  onDown(e) {
    if (!this.active) return;
    e.preventDefault();
    try { this.canvas.setPointerCapture(e.pointerId); } catch (x) {}
    const p = this.pt(e);
    const t = this.tool;
    if (t === "eraser") { this.mode = "erase"; this.eraseAt(p); return; }
    if (t === "lasso") { this.mode = "lasso"; this.lassoPts = [p]; this.renderOff(); this.paint(); return; }
    if (t === "select") { this.mode = "select"; this.start = p; this.selected = new Set(); this.renderOff(); this.paint(); return; }
    if (t === "line" || t === "arrow" || t === "rect" || t === "ellipse") {
      this.drawing = true; this.mode = "shape";
      this.cur = { tool: t, color: this.color, width: this.width, opacity: this.opacity, points: [p, { x: p.x, y: p.y, p: p.p }] };
      this.paint(); return;
    }
    this.drawing = true; this.mode = "draw";
    this.cur = { tool: t, color: this.color, width: this.width, opacity: this.opacity, points: [p] };
    this.paint();
  },

  onMove(e) {
    if (!this.active) return;
    if (!this.drawing && this.mode !== "erase" && this.mode !== "lasso" && this.mode !== "select") return;
    e.preventDefault();
    const p = this.pt(e);
    if (this.mode === "erase") { this.eraseAt(p); return; }
    if (this.mode === "lasso") { this.lassoPts.push(p); this.paint(); return; }
    if (this.mode === "select") {
      // move selected strokes
      if (!this.moveStart) this.moveStart = p;
      const dx = p.x - this.moveStart.x, dy = p.y - this.moveStart.y;
      this.moveDx = dx; this.moveDy = dy; this.paint(); return;
    }
    if (this.mode === "shape") { this.cur.points[1] = p; this.paint(); return; }
    this.cur.points.push(p);
    this.paint();
  },

  onUp(e) {
    if (!this.active) return;
    if (this.mode === "erase") { this.mode = null; this.commitChange(); return; }
    if (this.mode === "lasso") {
      this.selectInLasso(this.lassoPts);
      this.lassoPts = null; this.mode = "select"; this.start = this.pt(e); this.moveStart = null; this.renderOff(); this.paint(); return;
    }
    if (this.mode === "select") {
      if (this.moveStart && (this.moveDx || this.moveDy)) {
        this.strokes.forEach((s) => { if (this.selected.has(s)) { s.points.forEach((pt) => { pt.x += this.moveDx; pt.y += this.moveDy; }); } });
        this.redo = [];
      }
      this.moveStart = null; this.moveDx = 0; this.moveDy = 0;
      this.mode = null; this.renderOff(); this.paint(); this.commitChange(); return;
    }
    if (this.drawing && this.cur) {
      if (this.cur.points.length > 1 || this.mode === "shape") {
        this.strokes.push(this.cur); this.redo = [];
      }
      this.cur = null; this.drawing = false; this.mode = null;
      this.renderOff(); this.paint(); this.commitChange();
    }
  },

  eraseAt(p) {
    const rad = Math.max(8, this.width * 4);
    const before = this.strokes.length;
    this.strokes = this.strokes.filter((s) => !this.strokeNear(s, p, rad));
    if (this.strokes.length !== before) { this.renderOff(); this.paint(); }
  },
  strokeNear(s, p, rad) {
    const pts = s.points;
    for (let i = 0; i < pts.length - 1; i++) if (distToSeg(p, pts[i], pts[i + 1]) < rad) return true;
    if (pts.length === 1) return Math.hypot(pts[0].x - p.x, pts[0].y - p.y) < rad;
    return false;
  },

  selectInLasso(poly) {
    if (!poly || poly.length < 3) return;
    this.selected = new Set();
    this.strokes.forEach((s) => {
      const inside = s.points.every((pt) => pointInPoly(pt, poly));
      const center = centroid(s.points);
      if (inside || pointInPoly(center, poly)) this.selected.add(s);
    });
  },

  selectAll() { this.selected = new Set(this.strokes); this.renderOff(); this.paint(); },
  clearSelection() { this.selected = new Set(); this.renderOff(); this.paint(); },
  deleteSelected() { if (!this.selected.size) return; this.strokes = this.strokes.filter((s) => !this.selected.has(s)); this.selected = new Set(); this.renderOff(); this.paint(); this.commitChange(); },
  recolorSelected(color) { if (!this.selected.size) return; this.selected.forEach((s) => s.color = color); this.renderOff(); this.paint(); this.commitChange(); },

  undo() {
    if (!this.strokes.length) return;
    this.redo.push(this.strokes.pop()); this.renderOff(); this.paint(); this.commitChange();
  },
  redoLast() {
    if (!this.redo.length) return;
    this.strokes.push(this.redo.pop()); this.renderOff(); this.paint(); this.commitChange();
  },
  clearAll() { this.redo = this.strokes.slice(); this.strokes = []; this.selected = new Set(); this.renderOff(); this.paint(); this.commitChange(); },

  renderOff() {
    if (!this.offctx) return;
    this.offctx.clearRect(0, 0, this.w, this.h);
    const skip = (this.mode === "select") ? this.selected : null;
    this.strokes.forEach((s) => { if (skip && skip.has(s)) return; this.drawStroke(this.offctx, s, 0, 0); });
  },
  paint() {
    if (!this.ctx) return;
    this.ctx.clearRect(0, 0, this.w, this.h);
    this.ctx.drawImage(this.off, 0, 0, this.w, this.h);
    if (this.mode === "select") {
      const dx = this.moveDx || 0, dy = this.moveDy || 0;
      this.selected.forEach((s) => {
        this.drawStroke(this.ctx, s, dx, dy);
        if (dx === 0 && dy === 0) { this.ctx.save(); this.ctx.globalAlpha = .5; this.ctx.strokeStyle = "#3f7d9d"; this.ctx.setLineDash([4, 3]); this.ctx.lineWidth = 1; const b = strokeBounds(s); this.ctx.strokeRect(b.x0 - 3 + dx, b.y0 - 3 + dy, b.x1 - b.x0 + 6, b.y1 - b.y0 + 6); this.ctx.restore(); }

function openSlash() {

function toggleFind() {
  if (Ws.find.open) { closeFind(); return; }
  Ws.find.open = true;
  const bar = el("div", { class: "findbar", id: "findbar" });
  const q = el("input", { class: "input", placeholder: "Find", style: "flex:1;min-width:110px" });
  const r = el("input", { class: "input", placeholder: "Replace", style: "flex:1;min-width:110px" });
  const info = el("span", { class: "hint", text: "0/0", style: "min-width:34px;text-align:center" });
  bar.append(q, r, info,
    el("button", { class: "btn btn--sm", text: "Prev", onClick: () => gotoMatch(-1) }),
    el("button", { class: "btn btn--sm", text: "Next", onClick: () => gotoMatch(1) }),
    el("button", { class: "btn btn--sm", text: "Replace", onClick: replaceOne }),
    el("button", { class: "btn btn--sm", text: "All", onClick: replaceAll }),
    el("button", { class: "iconbtn", "aria-label": "Close find", html: icon("close"), onClick: closeFind }));
  $("#dock").appendChild(bar);
  q.addEventListener("input", () => { Ws.find.query = q.value; runFind(); });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); gotoMatch(e.shiftKey ? -1 : 1); } });
  Ws.find.info = info; Ws.find.replaceInput = r;
  setTimeout(() => q.focus(), 50);
}
function closeFind() { Ws.find.open = false; const b = $("#findbar"); if (b) b.remove(); clearFindMarks(); }
function clearFindMarks() {
  if (!Ws.el.doc) return;
  Ws.el.doc.querySelectorAll("mark.find").forEach((m) => { const t = document.createTextNode(m.textContent); m.parentNode.replaceChild(t, m); });
  Ws.el.doc.normalize(); Ws.find.matches = []; Ws.find.idx = -1;
}
function runFind() {
  clearFindMarks();
  const q = Ws.find.query; if (!q) { if (Ws.find.info) Ws.find.info.textContent = "0/0"; return; }
  const walker = document.createTreeWalker(Ws.el.doc, NodeFilter.SHOW_TEXT, null);
  const nodes = []; let n;
  while ((n = walker.nextNode())) { if (n.parentNode && !/SCRIPT|STYLE/.test(n.parentNode.nodeName)) nodes.push(n); }
  const lq = q.toLowerCase();
  nodes.forEach((node) => {
    const text = node.nodeValue; const lower = text.toLowerCase();
    let idx = lower.indexOf(lq); if (idx < 0) return;
    const frag = document.createDocumentFragment(); let last = 0;
    while (idx >= 0) {
      if (idx > last) frag.appendChild(document.createTextNode(text.slice(last, idx)));
      const m = el("mark", { class: "find" }); m.textContent = text.slice(idx, idx + q.length); frag.appendChild(m);
      last = idx + q.length; idx = lower.indexOf(lq, last);
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
  Ws.find.matches = Array.from(Ws.el.doc.querySelectorAll("mark.find"));
  Ws.find.idx = Ws.find.matches.length ? 0 : -1; updateFindInfo(); if (Ws.find.idx >= 0) scrollToMatch();
}
function updateFindInfo() { if (Ws.find.info) Ws.find.info.textContent = (Ws.find.idx + 1) + "/" + Ws.find.matches.length; }
function gotoMatch(dir) { if (!Ws.find.matches.length) return; Ws.find.idx = (Ws.find.idx + dir + Ws.find.matches.length) % Ws.find.matches.length; updateFindInfo(); scrollToMatch(); }
function scrollToMatch() { const m = Ws.find.matches[Ws.find.idx]; if (m) m.scrollIntoView({ block: "center", behavior: "smooth" }); }
function replaceOne() { const m = Ws.find.matches[Ws.find.idx]; if (!m) return; m.replaceWith(document.createTextNode(Ws.find.replaceInput.value)); onEditorInput(); runFind(); }
function replaceAll() { if (!Ws.find.matches.length) return; Ws.find.matches.forEach((m) => m.replaceWith(document.createTextNode(Ws.find.replaceInput.value))); onEditorInput(); runFind(); }

/* ------------------------------------------------------------
   Markdown converters
   ------------------------------------------------------------ */
function mdToHtml(md) {
  const lines = (md || "").split(/\r?\n/);
  let out = "", inCode = false, inList = false, listType = "";
  const inline = (s) => escapeHtml(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  const closeList = () => { if (inList) { out += "</" + listType + ">"; inList = false; } };
  lines.forEach((line) => {
    if (/^```/.test(line)) { if (inCode) { out += "</code></pre>"; inCode = false; } else { closeList(); out += "<pre><code>"; inCode = true; } return; }
    if (inCode) { out += escapeHtml(line) + "\n"; return; }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { closeList(); out += "<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"; return; }
    if (/^\s*[-*+]\s+/.test(line)) { if (!inList || listType !== "ul") { closeList(); out += "<ul>"; inList = true; listType = "ul"; } out += "<li>" + inline(line.replace(/^\s*[-*+]\s+/, "")) + "</li>"; return; }
    if (/^\s*\d+\.\s+/.test(line)) { if (!inList || listType !== "ol") { closeList(); out += "<ol>"; inList = true; listType = "ol"; } out += "<li>" + inline(line.replace(/^\s*\d+\.\s+/, "")) + "</li>"; return; }
    if (/^>\s?/.test(line)) { closeList(); out += "<blockquote>" + inline(line.replace(/^>\s?/, "")) + "</blockquote>"; return; }
    if (/^\s*$/.test(line)) { closeList(); return; }
    closeList(); out += "<p>" + inline(line) + "</p>";
  });
  closeList(); if (inCode) out += "</code></pre>";
  return out;
}
function htmlToMarkdown(html) {
  const d = document.createElement("div"); d.innerHTML = html || "";
  const walk = (node) => {
    let out = "";
    node.childNodes.forEach((n) => {
      if (n.nodeType === 3) { out += n.nodeValue.replace(/\s+/g, " "); return; }
      if (n.nodeType !== 1) return;
      const tag = n.nodeName, inner = walk(n);
      switch (tag) {
        case "H1": out += "\n# " + inner.trim() + "\n"; break;
        case "H2": out += "\n## " + inner.trim() + "\n"; break;
        case "H3": out += "\n### " + inner.trim() + "\n"; break;
        case "STRONG": case "B": out += "**" + inner + "**"; break;
        case "EM": case "I": out += "*" + inner + "*"; break;
        case "S": case "STRIKE": case "DEL": out += "~~" + inner + "~~"; break;
        case "CODE": out += (n.parentNode && n.parentNode.nodeName === "PRE") ? inner : "`" + inner + "`"; break;
        case "PRE": out += "\n```\n" + n.textContent + "\n```\n"; break;
        case "A": out += "[" + inner + "](" + (n.getAttribute("href") || "") + ")"; break;
        case "IMG": out += "![image](" + (n.getAttribute("src") || "").slice(0, 60) + "…)"; break;
        case "LI": out += "\n- " + inner.trim(); break;
        case "BLOCKQUOTE": out += "\n> " + inner.trim() + "\n"; break;
        case "HR": out += "\n---\n"; break;
        case "BR": out += "\n"; break;
        case "P": case "DIV": out += "\n" + inner + "\n"; break;
        case "FIGCAPTION": out += "\n*" + inner.trim() + "*\n"; break;
        default: out += inner;
      }
    });
    return out;
  };
  return walk(d).replace(/\n{3,}/g, "\n\n").trim();
}

  if (!q) return true;

  return i === q.length;
}

async function openPalette(initial) {
  if (Palette.open) return;
  Palette.open = true; Palette.q = initial || ""; Palette.idx = 0;
  const root = $("#palette-root"); root.innerHTML = "";
  const ov = el("div", { class: "palette-overlay", id: "palette-overlay" });
  const box = el("div", { class: "palette", role: "dialog", "aria-label": "Command palette" });
  const head = el("div", { class: "palette__head" });
  head.innerHTML = icon("search");
  const input = el("input", { class: "palette__input", placeholder: "Search notes, sources, commands…", value: Palette.q, "aria-label": "Command or search", autocomplete: "off" });
  head.appendChild(input);
  const hint = el("span", { class: "kbd", text: "esc" });
  head.appendChild(hint);
  box.appendChild(head);
  const list = el("div", { class: "palette__list", role: "listbox" });
  box.appendChild(list);
  const foot = el("div", { class: "palette__foot" });
  foot.innerHTML = "<span>↑↓ navigate</span><span>↵ open</span><span>esc close</span>";
  box.appendChild(foot);
  ov.appendChild(box); root.appendChild(ov);
  requestAnimationFrame(() => ov.classList.add("open"));

  const close = () => { Palette.open = false; ov.classList.remove("open"); setTimeout(() => ov.remove(), 160); document.removeEventListener("keydown", onKey, true); };
  const onKey = (e) => { if (e.key === "Escape") { e.preventDefault(); close(); } };
  document.addEventListener("keydown", onKey, true);
  ov.addEventListener("mousedown", (e) => { if (e.target === ov) close(); });

  const render = async () => {
    const q = input.value.trim(); Palette.q = q; Palette.idx = 0;
    let items = [];
    const cmds = commandCatalog().filter((c) => fuzzy(q, c.label) || fuzzy(q, c.group));
    if (q) items = items.concat(cmds.map((c) => ({ type: "cmd", cmd: c })));
    else items = items.concat(cmds.map((c) => ({ type: "cmd", cmd: c })));
    if (q) {
      const res = await globalSearch(q);
      const order = ["documents", "notes", "subjects", "sources", "experiments", "questions", "annotations", "tags", "attachments", "ink"];
      const labels = { documents: "Documents", notes: "Notes", subjects: "Subjects", sources: "Sources", experiments: "Experiments", questions: "Questions", annotations: "Annotations", tags: "Tags", attachments: "Attachments", ink: "Ink" };
      order.forEach((k) => (res.groups[k] || []).slice(0, 5).forEach((it) => items.push({ type: "result", group: labels[k], it, q })));
    }
    Palette.items = items;
    paint();
  };
  const paint = () => {
    list.innerHTML = "";
    if (!Palette.items.length) { list.appendChild(el("div", { class: "palette__empty", text: Palette.q ? "No matches" : "Type to search" })); return; }
    let last = null;
    Palette.items.forEach((item, i) => {
      const group = item.type === "cmd" ? item.cmd.group : item.group;
      if (group !== last) { list.appendChild(el("div", { class: "palette__group", text: group })); last = group; }
      const b = el("button", { class: "palette__item", role: "option", "aria-selected": String(i === Palette.idx) });
      if (item.type === "cmd") b.innerHTML = '<span class="pi-icon">' + icon(item.cmd.icon) + '</span><span class="pi-body"><span class="pi-title">' + escapeHtml(item.cmd.label) + "</span></span>" + (item.cmd.hint ? '<span class="pi-badge">' + item.cmd.hint + "</span>" : "");
      else b.innerHTML = '<span class="pi-icon">' + icon(resultIcon(item.it.type)) + '</span><span class="pi-body"><span class="pi-title">' + hl(item.it.title, Palette.q) + "</span>" + (item.it.sub ? '<span class="pi-sub">' + escapeHtml(item.it.sub) + "</span>" : "") + "</span>";
      b.addEventListener("mouseenter", () => { Palette.idx = i; paint(); });
      b.addEventListener("click", () => run(i));
      list.appendChild(b);
    });
  };
  const run = (i) => {
    const item = Palette.items[i]; if (!item) return;
    close();
    if (item.type === "cmd") item.cmd.run();
    else gotoResult(item.it);
  };
  input.addEventListener("input", debounce(render, 130));
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); Palette.idx = Math.min(Palette.idx + 1, Palette.items.length - 1); paint(); scrollSel(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); Palette.idx = Math.max(Palette.idx - 1, 0); paint(); scrollSel(); }
    else if (e.key === "Enter") { e.preventDefault(); run(Palette.idx); }
  });
  function scrollSel() { const s = list.querySelector('[aria-selected="true"]'); if (s) s.scrollIntoView({ block: "nearest" }); }
  render();
  setTimeout(() => input.focus(), 40);
}

function searchHints() {

async function exportLibraryFlow() {
  toast("Preparing backup…", { icon: "download" });
  const blob = await exportLibrary();
  downloadBlob("atelier-library-" + new Date().toISOString().slice(0, 10) + ".json", blob);
  toast("Library exported", { kind: "ok" });
}
function importLibraryFlow() {
  const input = el("input", { type: "file", accept: ".json,.atelier", style: "display:none" });
  input.addEventListener("change", async () => {
    const f = input.files && input.files[0]; if (!f) return;
    const text = await readFileText(f);
    const mode = await new Promise((res) => {
      const wrap = el("div");
      wrap.appendChild(el("p", { style: "font-size:14px;margin-bottom:12px", text: "How should this backup be imported?" }));
      const foot = el("div", { style: "display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap" });
      foot.appendChild(el("button", { class: "btn", text: "Merge with current", onClick: () => { d.close(); res("merge"); } }));
      foot.appendChild(el("button", { class: "btn btn--danger", text: "Replace everything", onClick: () => { d.close(); res("replace"); } }));
      const d = openOverlay({ title: "Import library", content: wrap, footer: foot });
    });
    try { await importLibrary(text, mode); toast("Import complete", { kind: "ok" }); Router.go("#/home"); }
    catch (e) { toast("Import failed: " + e.message); }
  });
  document.body.appendChild(input); input.click(); setTimeout(() => input.remove(), 1000);
}
function importDocumentFlow() {
  const input = el("input", { type: "file", accept: ".md,.markdown,.txt,.html,.htm", style: "display:none" });
  input.addEventListener("change", async () => {
    const f = input.files && input.files[0]; if (!f) return;
    const subject = await pickSubject();
    const text = await readFileText(f);
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    let html;
    if (ext === "md" || ext === "markdown") html = mdToHtml(text);
    else if (ext === "html" || ext === "htm") html = sanitizeHtml(text.replace(/^[\s\S]*?<body[^>]*>/i, "").replace(/<\/body>[\s\S]*$/i, ""));
    else html = "<p>" + escapeHtml(text).replace(/\n{2,}/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";
    const doc = await createDocument({ subjectId: subject, title: f.name.replace(/\.[^.]+$/, ""), type: "doc", html });
    toast("Imported " + f.name, { kind: "ok" }); openDoc(doc.id);
  });
  document.body.appendChild(input); input.click(); setTimeout(() => input.remove(), 1000);
}
function importPdfFlow() {
  const input = el("input", { type: "file", accept: ".pdf", style: "display:none" });
  input.addEventListener("change", async () => {
    const f = input.files && input.files[0]; if (!f) return;
    const subject = await pickSubject();
    await createAttachment({ subjectId: subject, name: f.name, type: "application/pdf" }, f);
    const doc = await createDocument({ subjectId: subject, title: f.name.replace(/\.pdf$/i, ""), type: "doc", html: "<h1>" + escapeHtml(f.name) + "</h1><p>Imported PDF attached to this document.</p><p><em>Open it from the subject's Attachments tab, or add notes and annotations here.</em></p>" });
    toast("PDF imported", { kind: "ok" }); openDoc(doc.id);
  });
  document.body.appendChild(input); input.click(); setTimeout(() => input.remove(), 1000);
}
function pickSubject() {
  return new Promise((res) => {
    if (!State.subjects.length) { res(null); return; }
    if (State.subjects.length === 1) { res(State.subjects[0].id); return; }
    const wrap = el("div"); const list = el("div", { class: "list" });
    State.subjects.forEach((s) => list.appendChild(el("button", { class: "docrow", onClick: () => { d.close(); res(s.id); } }, [el("span", { class: "docrow__icon", html: icon(s.icon || "book") }), el("span", { class: "docrow__body" }, el("span", { class: "docrow__title", text: s.name }))])));
    wrap.appendChild(list);
    const d = openOverlay({ title: "Choose a subject", content: wrap, onClose: () => res(State.subjects[0].id) });
  });
}

/* ============================================================
   Global handlers
   ============================================================ */
function setupGlobalHandlers() {
  $("#btn-quick").addEventListener("click", (e) => openQuickAdd(e.currentTarget));
  $("#btn-search").addEventListener("click", () => openPalette());
  $("#btn-theme").addEventListener("click", cycleTheme);
  $("#btn-full").addEventListener("click", () => toggleImmersive());
  if (window.visualViewport) { const setVV = () => document.documentElement.style.setProperty("--app-h", window.visualViewport.height + "px"); window.visualViewport.addEventListener("resize", setVV); window.visualViewport.addEventListener("scroll", () => window.scrollTo(0, 0)); setVV(); }
  const sidebarBtn = $("#btn-sidebar");
  sidebarBtn.addEventListener("click", () => setSidebar(!State.settings.sidebarCollapsed));
  const savePill = $("#save-status");
  savePill.addEventListener("click", () => toast(Storage.mode === "idb" ? "Saved locally in IndexedDB — works offline" : "Saved in this browser (fallback storage)", { icon: "layers" }));
  $$("#bottomnav .bn").forEach((b) => b.addEventListener("click", () => { if (b.dataset.nav === "more") openMoreSheet(); else Router.go("#/" + b.dataset.nav); }));
  document.addEventListener("keydown", (e) => {
    const mod = e.metaKey || e.ctrlKey;
    const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
    if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
    if (mod && e.key.toLowerCase() === "p") { e.preventDefault(); openPalette(); return; }
    if (e.key === "/" && !inField && !mod) { e.preventDefault(); openPalette(); return; }
    if (mod && e.shiftKey && e.key.toLowerCase() === "f" && Ws.docId) { e.preventDefault(); toggleFocus(); return; }
  });
  window.addEventListener("online", () => { State.online = true; if (State.saveState !== "saving") setSaveStatus("saved"); toast("Back online", { kind: "ok" }); });
  window.addEventListener("offline", () => { State.online = false; setSaveStatus("offline"); toast("Working offline", { icon: "info" }); });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (State.settings.theme === "system") applyTheme(); });
  window.addEventListener("resize", debounce(() => { if (Ws.docId) applyWsChrome(); }, 150));
  /* drag & drop images anywhere -> gallery wall */
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
  document.addEventListener("dragover", (e) => { if (hasFiles(e)) { e.preventDefault(); document.body.classList.add("dragging-images"); } });
  document.addEventListener("dragleave", (e) => { if (e.target === document.documentElement) document.body.classList.remove("dragging-images"); });
  document.addEventListener("drop", (e) => { if (!hasFiles(e)) return; e.preventDefault(); document.body.classList.remove("dragging-images"); if (e.dataTransfer.files && e.dataTransfer.files.length) addGalleryImages(e.dataTransfer.files); });
  if (!State.online) setSaveStatus("offline");
}

   Boot
   ============================================================ */
async function boot() {
  try { await Storage.init(); } catch (e) {}
  await loadLibrary();
  await seedIfEmpty();
  await loadLibrary();

  Router.on("home", () => { leaveWorkspace(); renderHome(); });
  Router.on("notes", () => { leaveWorkspace(); renderNotesPage(); });
  Router.on("subjects", () => { leaveWorkspace(); renderSubjectsPage(); });
  Router.on("subject", (p) => { leaveWorkspace(); renderSubjectPage(p[0], p[1]); });
  Router.on("doc", (p) => { renderWorkspace(p[0]); });
  Router.on("new", (p) => { leaveWorkspace(); renderNewDocument(p[0], p[1]); });
  Router.on("experiment", (p) => { leaveWorkspace(); renderExperimentPage(p[0]); });
  Router.on("project", (p) => { leaveWorkspace(); renderProjectPage(p[0]); });
  Router.on("map", (p) => { leaveWorkspace(); renderMapPage(p[0]); });
  Router.on("search", (p) => { leaveWorkspace(); renderSearchPage(p[0] ? decodeURIComponent(p[0]) : ""); });
  Router.on("recent", () => { leaveWorkspace(); renderRecentPage(); });
  Router.on("settings", () => { leaveWorkspace(); renderSettingsPage(); });

  Router.init();
  setupGlobalHandlers();
  applyTheme(); applyEditorSettings();
  setSidebar(!!State.settings.sidebarCollapsed);
  setSaveStatus(State.online ? "saved" : "offline");
  if (!location.hash) location.hash = "#/home";
  Router.resolve();
  State.ready = true;
  window.__atelier = { State, Ink, Ws, Storage, Router, exportLibrary, importLibrary, globalSearch, libraryStats, Palette };
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

})();

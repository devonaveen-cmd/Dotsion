<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="color-scheme" content="light dark"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="description" content="Atelier — a local-first, offline research workspace. Write, annotate, organise sources and experiments. Your library stays on your device."/>
<title>Atelier — Research Workspace</title>
<style>
/* ============================================================
   Atelier — calm paper design system (single pass, no overrides)
   Light: warm paper. Dark: soft charcoal. One restrained accent.
   ============================================================ */
:root{
  --color-bg:#ffffff;
  --color-sidebar:#f7f7f5;
  --color-elevated:#ffffff;
  --color-surface:#ffffff;
  --color-surface-2:#f1f1ef;
  --color-surface-raised:#ffffff;
  --color-border:#ebebe8;
  --color-border-strong:#d9d9d5;
  --color-text:#37352f;
  --color-text-2:#5f5e5b;
  --color-muted:#787774;
  --color-accent:#2383e2;
  --color-accent-strong:#1a6fc4;
  --color-accent-soft:#e7f3fc;
  --color-on-accent:#ffffff;
  --color-ok:#2f9e6b;--color-warn:#c27f1a;--color-danger:#d44c47;
  --color-periwinkle:#2383e2;--color-lilac:#9065b0;--color-coral:#d9730d;
  --color-mint:#2f9e6b;--color-butter:#c27f1a;--color-rose:#c14c8a;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;
  --radius-xs:3px;--radius-sm:5px;--radius-md:6px;--radius-lg:10px;
  --shadow-sm:0 1px 2px rgba(15,15,15,.06);
  --shadow-md:0 4px 16px rgba(15,15,15,.10);
  --shadow-lg:0 12px 40px rgba(15,15,15,.18);
  --glow:0 0 0 3px rgba(35,131,226,.25);
  --glow-soft:0 0 0 2px rgba(35,131,226,.25);
  --font-ui:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-display:var(--font-ui);
  --editor-font:var(--font-ui);--editor-size:17px;--editor-lh:1.7;--editor-measure:760px;
  --topbar-h:46px;--sidebar-w:260px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --bg:var(--color-bg);--surface:var(--color-surface);--surface-2:var(--color-surface-2);
  --text:var(--color-text);--text-2:var(--color-text-2);--muted:var(--color-muted);
  --border:var(--color-border);--border-2:var(--color-border-strong);--accent:var(--color-accent);
}
[data-theme="dark"]{
  --color-bg:#000000;
  --color-sidebar:#0a0a0a;
  --color-elevated:#000000;
  --color-surface:#0f0f0f;
  --color-surface-2:#1a1a1a;
  --color-surface-raised:#151515;
  --color-border:#232323;
  --color-border-strong:#363636;
  --color-text:#ededed;
  --color-text-2:#b8b8b8;
  --color-muted:#8c8c8c;
  --color-accent:#529cca;
  --color-accent-strong:#78b4dd;
  --color-accent-soft:rgba(82,156,202,.16);
  --color-on-accent:#000000;
  --color-ok:#4dab9a;--color-warn:#e0a640;--color-danger:#ff7369;
  --color-periwinkle:#529cca;--color-lilac:#9a6dd7;--color-coral:#ff8a4c;
  --color-mint:#4dab9a;--color-butter:#e0a640;--color-rose:#e255a1;
  --shadow-sm:0 0 0 1px rgba(255,255,255,.04);
  --shadow-md:0 8px 24px rgba(0,0,0,.8);
  --shadow-lg:0 16px 48px rgba(0,0,0,.9);
  --glow:0 0 0 3px rgba(82,156,202,.3);
  --glow-soft:0 0 0 2px rgba(82,156,202,.3);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;height:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--color-accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;border-radius:var(--radius-sm)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
svg{width:1.1em;height:1.1em;flex:none}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:row;height:100vh;height:100dvh;background:var(--color-bg)}
.app__col{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topbar{height:calc(var(--topbar-h) + var(--sat));padding:var(--sat) max(var(--space-3),var(--sar)) 0 max(var(--space-3),var(--sal));flex:none;display:flex;align-items:center;gap:var(--space-2);background:var(--color-bg);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;color:var(--color-text);white-space:nowrap;flex:none}
.brand:hover{text-decoration:none}
.brand__mark{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:var(--color-text);color:var(--color-bg);font-weight:700;font-size:12px;flex:none}
.brand__name{font-size:15px}
.cmdk{display:flex;align-items:center;gap:var(--space-2);flex:1;max-width:440px;min-width:0;background:var(--color-surface-2);border:1px solid transparent;border-radius:var(--radius-md);padding:6px 10px;color:var(--color-muted);text-align:left}
.cmdk:hover{border-color:var(--color-border-strong)}
.cmdk svg{width:16px;height:16px}
.cmdk__label{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--color-border-strong);border-radius:var(--radius-xs);padding:1px 5px;color:var(--color-muted);background:var(--color-surface);flex:none}
.topbar__actions{display:flex;align-items:center;gap:var(--space-1);margin-left:auto;flex:none}
.iconbtn{width:34px;height:34px;border-radius:var(--radius-sm);display:grid;place-items:center;flex:none;color:var(--color-text-2);transition:background .12s,color .12s}
.iconbtn:hover{background:var(--color-surface-2);color:var(--color-text)}
.iconbtn[aria-pressed="true"]{background:var(--color-accent-soft);color:var(--color-accent)}
.iconbtn svg{width:18px;height:18px}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--color-muted);border-radius:20px;padding:5px 10px;white-space:nowrap}
.status-pill:hover{background:var(--color-surface-2)}
.status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--color-ok)}
.status-pill[data-state="saving"] .dot{background:var(--color-warn);animation:pulse 1s infinite}
.status-pill[data-state="offline"] .dot{background:var(--color-muted)}
@keyframes pulse{50%{opacity:.3}}
.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.main.no-scroll{overflow:hidden}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:6px 12px;min-height:32px;border-radius:var(--radius-md);border:1px solid var(--color-border-strong);background:transparent;color:var(--color-text);font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--color-surface-2)}
.btn svg{width:16px;height:16px}
.btn--primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent);font-weight:600}
.btn--primary:hover{background:var(--color-accent-strong);border-color:var(--color-accent-strong)}
.btn--ghost{border-color:transparent;background:transparent;color:var(--color-text-2)}
.btn--ghost:hover{background:var(--color-surface-2)}
.btn--danger{color:var(--color-danger)}
.btn--danger:hover{background:color-mix(in srgb,var(--color-danger) 10%,transparent);border-color:var(--color-danger)}
.btn--sm{padding:6px 10px;font-size:12.5px;border-radius:var(--radius-sm)}
.btn--block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--color-surface-2);color:var(--color-text-2);border:1px solid transparent}
.chip--accent{background:var(--color-accent-soft);color:var(--color-accent)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:var(--space-3)}
.field>label{font-size:12.5px;font-weight:600;color:var(--color-text-2)}
.input,.select,.textarea{width:100%;padding:9px 11px;border-radius:var(--radius-md);border:1px solid var(--color-border-strong);background:var(--color-surface);font-size:14px;outline:none;transition:border-color .12s,box-shadow .12s}
.input::placeholder,.textarea::placeholder{color:var(--color-muted)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--color-accent);box-shadow:var(--glow)}
.textarea{min-height:82px;resize:vertical}
.select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--color-muted) 50%),linear-gradient(135deg,var(--color-muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.hint{font-size:12.5px;color:var(--color-muted)}
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--color-border-strong);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--color-accent);margin-top:-6px}
input[type=range]::-moz-range-track{height:4px;background:var(--color-border-strong);border-radius:2px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;border:none;background:var(--color-accent)}

/* ---------- page ---------- */
.page{max-width:1000px;margin:0 auto;padding:var(--space-8) max(clamp(16px,6vw,72px),var(--sar)) calc(96px + var(--sab)) max(clamp(16px,6vw,72px),var(--sal))}
.section{margin-top:40px}
.section__head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:14px;flex-wrap:wrap}
.section__title{font-size:13px;font-weight:650;color:var(--color-text-2)}
.list{display:flex;flex-direction:column;gap:2px}
.empty{padding:var(--space-6) var(--space-4);text-align:center;color:var(--color-muted);border:1px dashed var(--color-border-strong);border-radius:var(--radius-lg)}
.empty svg{width:24px;height:24px;margin-bottom:var(--space-2);color:var(--color-muted)}
.empty p{font-size:13.5px;margin-bottom:var(--space-3)}
.empty--inline{border:none;padding:var(--space-3);text-align:left}
.greet{font-size:clamp(24px,5vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.greet__sub{color:var(--color-text-2);margin-top:6px}

/* ---------- home ---------- */
.home-page{max-width:1000px}
.home-head{display:flex;flex-direction:column;gap:6px}
.home-head__title{font-size:clamp(28px,5.5vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.15}
.home-head__sub{color:var(--color-text-2);font-size:15px}
.home-head__meta{color:var(--color-muted);font-size:12.5px;margin-top:2px}
.home-search{display:flex;align-items:center;gap:var(--space-3);margin-top:20px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-lg);padding:12px 14px;transition:box-shadow .12s,border-color .12s}
.home-search:focus-within{border-color:var(--color-accent);box-shadow:var(--glow)}
.home-search svg{width:18px;height:18px;color:var(--color-muted)}
.home-search input{flex:1;border:none;outline:none;background:none;font-size:15px;min-width:0}
.home-actions{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:14px}

.note-grid{display:grid;grid-template-columns:1fr;gap:12px}
.note-card{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:0;overflow:hidden;min-height:0;transition:background .12s,box-shadow .12s}
.note-card:hover{background:var(--color-surface-2);box-shadow:var(--shadow-sm)}
.note-card__top{order:2;display:flex;align-items:center;gap:8px;min-height:22px;padding:12px 12px 0}
.note-card__subj{font-size:12px;font-weight:500;color:var(--color-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-card__menu{margin-left:auto;width:26px;height:26px;opacity:0;transition:opacity .12s}
.note-card:hover .note-card__menu,.note-card:focus-within .note-card__menu{opacity:1}
.note-card__title{order:3;font-size:15px;font-weight:600;line-height:1.3;padding:2px 14px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-card__snip{order:1;flex:none;height:104px;overflow:hidden;background:var(--color-surface-2);border-bottom:1px solid var(--color-border);padding:12px 14px;font-size:11.5px;line-height:1.55;color:var(--color-muted);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.note-card__foot{order:4;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-muted);padding:8px 14px 14px}
.note-card__foot .dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}

.grid-subjects{display:grid;grid-template-columns:1fr;gap:12px}
.subject-card{position:relative;display:block;width:100%;background:transparent;border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:14px;text-align:left;transition:background .12s}
.subject-card:hover{background:var(--color-surface-2)}
.subject-card__top{display:flex;align-items:center;gap:12px;padding-right:30px}
.subject-card__icon{width:34px;height:34px;border-radius:var(--radius-md);display:grid;place-items:center;flex:none;background:var(--color-surface-2);color:var(--color-text-2)}
.subject-card__icon svg{width:18px;height:18px}
.subject-card__name{font-weight:650;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subject-card__meta{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:10px;font-size:12.5px;color:var(--color-muted)}
.subject-card__meta b{color:var(--color-text);font-weight:650}
.subject-card__menu{position:absolute;top:10px;right:10px;width:30px;height:30px;opacity:0;transition:opacity .12s}
.subject-card:hover .subject-card__menu,.subject-card:focus-within .subject-card__menu{opacity:1}
.subject-card--add{display:flex;align-items:center;justify-content:center;gap:8px;min-height:78px;border-style:dashed;background:transparent;color:var(--color-muted);font-weight:550}
.subject-card--add:hover{color:var(--color-text);background:var(--color-surface-2)}
@media (pointer:coarse){.note-card__menu,.subject-card__menu,.docrow>.iconbtn,.tile__acts{opacity:1}}

.docrow{display:flex;align-items:center;gap:var(--space-3);padding:10px 12px;border-radius:var(--radius-md);border:1px solid transparent;text-align:left;width:100%;transition:background .12s}
.docrow:hover{background:var(--color-surface);border-color:var(--color-border)}
.docrow__icon{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--color-surface-2);display:grid;place-items:center;flex:none;color:var(--color-text-2)}
.docrow__icon svg{width:16px;height:16px}
.docrow__body{min-width:0;flex:1}
.docrow__title{display:block;font-weight:550;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docrow__meta{font-size:12px;color:var(--color-muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
.docrow__meta .sep{opacity:.5}
.docrow>.iconbtn{opacity:0}
.docrow:hover>.iconbtn,.docrow:focus-within>.iconbtn{opacity:1}

/* gallery — a quiet section, not the home's hero */
.gallery{display:grid;gap:8px}
.gallery--grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.gallery--grid .tile{aspect-ratio:1}
.gallery--mosaic{grid-template-columns:repeat(4,1fr);grid-auto-rows:120px;grid-auto-flow:dense}
.gallery--mosaic .tile:nth-child(7n+1){grid-column:span 2;grid-row:span 2}
.gallery--editorial{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.gallery--editorial .tile{aspect-ratio:3/4}
.gallery--row{display:flex;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.gallery--row .tile{flex:0 0 160px;aspect-ratio:1;scroll-snap-align:start}
@media (max-width:900px){
  .gallery--mosaic{grid-template-columns:repeat(2,1fr);grid-auto-rows:auto;grid-auto-flow:row}
  .gallery--mosaic .tile{grid-column:auto!important;grid-row:auto!important;aspect-ratio:1}
}
.gallery-tools{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.tile{position:relative;margin:0;overflow:hidden;border-radius:var(--radius-md);background:var(--color-surface-2);border:1px solid var(--color-border);cursor:pointer}
.tile:hover{border-color:var(--color-border-strong)}
.tile__img{width:100%;height:100%;object-fit:cover;display:block}
.tile__cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(to top,rgba(0,0,0,.65),transparent);font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile__acts{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:opacity .12s}
.tile:hover .tile__acts,.tile:focus-within .tile__acts{opacity:1}
.tile__acts button{width:30px;height:30px;border-radius:var(--radius-sm);display:grid;place-items:center;background:rgba(0,0,0,.65);color:#fff}
.tile__acts button:hover{background:var(--color-accent)}
.tile__acts svg{width:14px;height:14px}
.gallery-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:32px 20px;border:1px dashed var(--color-border-strong);border-radius:var(--radius-lg);color:var(--color-muted);text-align:center}
.gallery-empty svg{width:24px;height:24px}
.lightbox-img{width:100%;max-height:58vh;object-fit:contain;border-radius:var(--radius-md);background:var(--color-surface-2)}
.drop-hint{position:fixed;inset:14px;border:2px dashed var(--color-accent);border-radius:16px;background:color-mix(in srgb,var(--color-bg) 80%,transparent);z-index:95;display:none;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--color-accent);pointer-events:none}
body.dragging-images .drop-hint{display:flex}

/* ---------- subject page ---------- */
.subject-head{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-3);padding:var(--space-4) 0 var(--space-3)}
.subject-head>.iconbtn{position:absolute;top:var(--space-4);right:0}
.subject-head__icon{width:64px;height:64px;border-radius:var(--radius-lg);display:grid;place-items:center;background:var(--color-surface-2);flex:none}
.subject-head__icon svg{width:32px;height:32px}
.subject-head h1{font-size:clamp(28px,6vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.15}
.subject-head p{color:var(--color-muted);font-size:13.5px;margin-top:4px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--color-border);position:sticky;top:0;background:var(--color-bg);z-index:20;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 12px;font-size:14px;font-weight:500;color:var(--color-muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--color-text)}
.tab[aria-selected="true"]{color:var(--color-accent);border-color:var(--color-accent)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3)}
.stat{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:14px 16px}
.stat__n{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.stat__l{font-size:12.5px;color:var(--color-muted);margin-top:6px}
.src-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:12px 14px;display:flex;gap:var(--space-3)}
.src-card__icon{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--color-surface-2);display:grid;place-items:center;flex:none;color:var(--color-text-2)}
.src-card__icon svg{width:16px;height:16px}
.src-card__body{min-width:0;flex:1}
.src-card__title{font-weight:620;font-size:14px}
.src-card__sub{font-size:12.5px;color:var(--color-muted);margin-top:2px}
.src-card__notes{font-size:13px;color:var(--color-text-2);margin-top:6px}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.q-item{display:flex;gap:var(--space-3);padding:11px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md);margin-bottom:6px;background:var(--color-surface);align-items:flex-start}
.q-check{width:22px;height:22px;border-radius:var(--radius-xs);border:1.5px solid var(--color-border-strong);display:grid;place-items:center;flex:none;margin-top:1px;color:transparent;background:var(--color-surface)}
.q-item[data-done="true"] .q-check{background:var(--color-ok);border-color:var(--color-ok);color:#fff}
.q-item[data-done="true"] .q-text{color:var(--color-muted);text-decoration:line-through}
.q-text{flex:1;font-size:14px;min-width:0;text-align:left}
.q-rel{font-size:12px;color:var(--color-muted);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;opacity:0;pointer-events:none;transition:opacity .16s var(--ease)}
.overlay.open{opacity:1;pointer-events:auto}
.overlay--center{align-items:center;justify-content:center;padding:var(--space-4)}
.overlay--right{justify-content:flex-end}
.overlay--left{justify-content:flex-start}
.overlay--bottom{align-items:flex-end}
.modal{background:var(--color-surface-raised);border:1px solid var(--color-border-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:500px;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(6px);transition:transform .18s var(--ease)}
.overlay.open .modal{transform:none}
.modal--wide{max-width:740px}
.modal__head{display:flex;align-items:center;gap:var(--space-3);padding:14px 16px;border-bottom:1px solid var(--color-border);flex:none}
.modal__head h2{font-size:15px;font-weight:650}
.modal__head .iconbtn{margin-left:auto}
.modal__body{padding:var(--space-4);overflow-y:auto}
.modal__foot{padding:12px 16px calc(12px + var(--sab));border-top:1px solid var(--color-border);display:flex;gap:var(--space-2);justify-content:flex-end;flex:none}
.drawer{background:var(--color-sidebar);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;width:min(88vw,380px);height:100dvh;transition:transform .2s var(--ease);border-left:1px solid var(--color-border)}
.sheet{background:var(--color-surface-raised);border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:var(--shadow-lg);width:100%;max-height:88dvh;display:flex;flex-direction:column;transition:transform .2s var(--ease);padding-bottom:var(--sab)}
.sheet__grip{width:36px;height:4px;border-radius:2px;background:var(--color-border-strong);margin:8px auto 0;flex:none}
.overlay--left .drawer{transform:translateX(-100%)}
.overlay--right .drawer{transform:translateX(100%)}
.overlay--bottom .sheet{transform:translateY(100%)}
.overlay.open .drawer,.overlay.open .sheet{transform:none}

.menu{position:fixed;z-index:70;background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:5px;min-width:210px;max-width:min(300px,92vw);max-height:min(70vh,540px);overflow-y:auto}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:var(--radius-sm);font-size:13.5px}
.menu button:hover{background:var(--color-surface-2)}
.menu button svg{width:16px;height:16px;color:var(--color-muted);flex:none}
.menu button.danger,.menu button.danger svg{color:var(--color-danger)}
.menu__sep{height:1px;background:var(--color-border);margin:5px 4px}
.menu__label{font-size:12px;font-weight:600;color:var(--color-muted);padding:8px 10px 3px}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--sab));z-index:80;display:flex;flex-direction:column;gap:var(--space-2);align-items:center;pointer-events:none}
.toast{background:var(--color-text);color:var(--color-bg);font-size:13px;font-weight:500;padding:9px 14px;border-radius:var(--radius-md);box-shadow:var(--shadow-md);display:flex;align-items:center;gap:9px;pointer-events:auto;max-width:88vw;animation:toastin .18s var(--ease)}
.toast svg{width:15px;height:15px}
.toast button{color:var(--color-accent-strong);font-weight:700}
[data-theme="light"] .toast button{color:#9cc3ee}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}}

.bottomnav{display:flex;flex:none;background:var(--color-bg);border-top:1px solid var(--color-border);padding:4px max(4px,var(--sar)) calc(4px + var(--sab)) max(4px,var(--sal));z-index:35}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:var(--radius-sm);color:var(--color-muted);font-size:11px;font-weight:550;min-height:48px;justify-content:center}
.bn svg{width:21px;height:21px}
.bn[aria-current="page"]{color:var(--color-accent)}

/* ---------- command palette ---------- */
.palette-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:flex;justify-content:center;align-items:flex-start;padding:11vh var(--space-4) var(--space-4);opacity:0;pointer-events:none;transition:opacity .14s}
.palette-overlay.open{opacity:1;pointer-events:auto}
.palette{width:min(620px,100%);background:var(--color-surface-raised);border:1px solid var(--color-border-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;max-height:72vh;overflow:hidden}
.palette__head{display:flex;align-items:center;gap:var(--space-3);padding:14px 16px;border-bottom:1px solid var(--color-border);flex:none}
.palette__head svg{width:17px;height:17px;color:var(--color-muted)}
.palette__input{flex:1;border:none;outline:none;background:none;font-size:15px;min-width:0}
.palette__list{overflow-y:auto;padding:6px}
.palette__group{font-size:12px;font-weight:600;color:var(--color-muted);padding:9px 10px 4px}
.palette__item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 10px;border-radius:var(--radius-md);font-size:13.5px}
.palette__item[aria-selected="true"]{background:var(--color-accent-soft)}
.pi-icon{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--color-surface-2);display:grid;place-items:center;flex:none;color:var(--color-text-2)}
.pi-icon svg{width:15px;height:15px}
.palette__item[aria-selected="true"] .pi-icon{color:var(--color-accent)}
.pi-body{min-width:0;flex:1}
.pi-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi-sub{display:block;font-size:12px;color:var(--color-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi-badge{font-size:11px;color:var(--color-muted);border:1px solid var(--color-border);border-radius:var(--radius-xs);padding:1px 6px;flex:none}
.palette__item mark,.result mark{background:transparent;color:var(--color-accent);font-weight:700}
.palette__empty{padding:var(--space-6);text-align:center;color:var(--color-muted)}
.palette__foot{display:flex;gap:var(--space-4);padding:9px 16px;border-top:1px solid var(--color-border);font-size:12px;color:var(--color-muted);flex:none;flex-wrap:wrap}

.slashmenu{position:fixed;z-index:75;background:var(--color-surface-raised);border:1px solid var(--color-border-strong);border-radius:var(--radius-md);box-shadow:var(--shadow-md);width:min(290px,86vw);max-height:min(52vh,420px);overflow-y:auto;padding:5px}
.slashmenu__group{font-size:12px;font-weight:600;color:var(--color-muted);padding:8px 10px 3px}
.slashmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:var(--radius-sm);font-size:13.5px}
.slashmenu button[aria-selected="true"]{background:var(--color-accent-soft)}
.slashmenu button svg{width:16px;height:16px;color:var(--color-muted)}

/* ---------- workspace ---------- */
.ws{display:grid;grid-template-columns:1fr;height:100%;min-height:0}
.ws__side,.ws__ctx{display:none;min-height:0}
.ws__main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative;background:var(--color-bg)}
.ws-head{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-1) max(var(--space-3),var(--sar)) var(--space-1) max(var(--space-3),var(--sal));background:var(--color-bg);border-bottom:1px solid var(--color-border);flex:none;min-height:44px}
.ws-head__lead{display:flex;flex-direction:column;min-width:0;flex:1}
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-muted);overflow:hidden;white-space:nowrap;min-width:0}
.crumb a{color:var(--color-muted);overflow:hidden;text-overflow:ellipsis}
.crumb a:hover{color:var(--color-accent)}
.crumb__sep{opacity:.5}
.ws-head__title{display:block;font-size:clamp(30px,6vw,42px);font-weight:700;letter-spacing:-.03em;line-height:1.2;border:none;background:none;outline:none;color:var(--color-text);width:100%;min-width:0;padding:56px 0 6px;font-family:var(--font-ui);position:relative;z-index:1}
.ws-head__title::placeholder{color:var(--color-muted);opacity:.6}
.ws-head__title:hover,.ws-head__title:focus{background:none}
.ws-head__actions{display:flex;align-items:center;gap:2px;flex:none}

.editor-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
.editor-wrap{position:relative;max-width:var(--editor-measure);margin:0 auto;padding:0 max(var(--space-5),var(--sal))}
@media (max-width:767px){.ws-head__title{padding-top:28px}}
.doc{outline:none;font-family:var(--editor-font);font-size:var(--editor-size);line-height:var(--editor-lh);color:var(--color-text);padding:8px 0 40vh;min-height:60vh;word-wrap:break-word;overflow-wrap:anywhere}
.doc[data-empty="true"]::before{content:attr(data-placeholder);color:var(--color-muted);pointer-events:none;position:absolute}
.doc ::selection{background:var(--color-accent-soft)}
.doc h1,.doc h2,.doc h3{font-weight:650;letter-spacing:-.02em;line-height:1.25;margin:1.5em 0 .4em}
.doc h1{font-size:1.9em}.doc h2{font-size:1.4em}.doc h3{font-size:1.15em}
.doc h1:first-child,.doc h2:first-child,.doc h3:first-child{margin-top:0}
.doc p{margin:0 0 .8em}
.doc ul,.doc ol{margin:0 0 .8em;padding-left:1.5em}
.doc li{margin:.25em 0}
.doc blockquote{margin:0 0 1em;padding:.15em 0 .15em 1em;border-left:3px solid var(--color-text);color:var(--color-text)}
.doc hr{border:none;border-top:1px solid var(--color-border);margin:1.6em 0}
.doc code{font-family:var(--font-mono);font-size:.86em;background:var(--color-surface-2);border-radius:var(--radius-xs);padding:1px 5px}
.doc pre{font-family:var(--font-mono);font-size:.83em;line-height:1.55;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:13px 14px;overflow-x:auto;margin:0 0 1em}
.doc pre code{background:none;padding:0;font-size:1em}
.doc table{border-collapse:collapse;width:100%;margin:0 0 1em;font-size:.92em}
.doc th,.doc td{border:1px solid var(--color-border-strong);padding:7px 10px;text-align:left;vertical-align:top}
.doc th{background:var(--color-surface-2);font-family:var(--font-ui);font-weight:650;font-size:.86em}
.doc figure{margin:0 0 1em}
.doc img{border-radius:var(--radius-md);display:block;max-width:100%;height:auto}
.doc figcaption{font-size:.82em;color:var(--color-muted);text-align:center;margin-top:6px;font-family:var(--font-ui)}
.doc .pagebreak{border-top:1px dashed var(--color-border-strong);margin:2em 0;height:0;position:relative}
.doc .pagebreak::after{content:"Page break";position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--color-muted);background:var(--color-bg);padding:0 8px;font-family:var(--font-ui)}
.doc .tablewrap{overflow-x:auto;max-width:100%}
.doc .checklist{list-style:none;padding-left:.1em}
.doc .checklist li{display:flex;gap:9px;align-items:flex-start}
.doc .checklist input[type=checkbox]{-webkit-appearance:none;appearance:none;margin-top:.4em;width:16px;height:16px;border:1.5px solid var(--color-border-strong);border-radius:var(--radius-xs);background:var(--color-surface);flex:none;position:relative;cursor:pointer}
.doc .checklist input[type=checkbox]:checked{background:var(--color-accent);border-color:var(--color-accent)}
.doc .checklist input[type=checkbox]:checked::after{content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid var(--color-on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.doc a{color:var(--color-accent)}

/* research blocks: quiet margin-rule, no coloured cards */
.rb{position:relative;margin:.9em 0;padding:12px 14px;border-radius:var(--radius-md);background:var(--color-surface-2);font-family:var(--font-ui);font-size:.93em}
.rb__label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--color-muted);margin-bottom:4px}
.rb__label svg{width:13px;height:13px}
.rb__body{outline:none;min-height:1.2em}
.rb[data-type="idea"],.rb[data-type="todo"]{background:color-mix(in srgb,var(--color-warn) 14%,transparent)}
.rb[data-type="question"],.rb[data-type="experiment"],.rb[data-type="important"],.rb[data-type="claim"]{background:color-mix(in srgb,var(--color-accent) 14%,transparent)}
.rb[data-type="hypothesis"]{background:color-mix(in srgb,var(--color-lilac) 14%,transparent)}
.rb[data-type="observation"],.rb[data-type="evidence"],.rb[data-type="conclusion"]{background:color-mix(in srgb,var(--color-ok) 14%,transparent)}
.rb[data-type="problem"],.rb[data-type="contradiction"]{background:color-mix(in srgb,var(--color-danger) 13%,transparent)}
.rb__evidence{margin-top:8px;padding-top:8px;border-top:1px dashed var(--color-border-strong);font-size:.9em}
.rb__evidence .ev{display:flex;align-items:center;gap:7px;padding:3px 0;color:var(--color-text-2)}
.rb__confidence{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--color-muted)}
.conf-dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--color-muted)}
.conf-dot.on{background:var(--color-accent);border-color:var(--color-accent)}
mark.ann{background:var(--color-accent-soft);border-bottom:2px solid var(--color-accent);padding:0 1px;border-radius:2px;color:inherit}
mark.find{background:rgba(224,177,90,.45);color:inherit}

/* ---------- toolbar dock ---------- */
.dock{flex:none;background:var(--color-bg);border-top:1px solid var(--color-border);padding-bottom:var(--sab)}
.tb{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;padding:6px max(var(--space-2),var(--sal))}
.tb::-webkit-scrollbar{display:none}
.tbtn{min-width:36px;height:36px;padding:0 8px;border-radius:var(--radius-sm);display:grid;place-items:center;flex:none;color:var(--color-text-2);transition:background .12s,color .12s}
.tbtn:hover{background:var(--color-surface-2);color:var(--color-text)}
.tbtn[aria-pressed="true"],.tbtn.active{background:var(--color-accent-soft);color:var(--color-accent)}
.tbtn svg{width:18px;height:18px}
.tbtn--text{font-weight:700;font-size:14px}
.tbtn--sel{min-width:auto;padding:0 10px;display:inline-flex;align-items:center;gap:6px}
.tb select{height:32px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);font-size:12.5px;padding:0 6px;max-width:112px;flex:none;color:var(--color-text-2)}
.tsep{width:1px;height:20px;background:var(--color-border);margin:0 6px;flex:none}
.tb-spacer{flex:1;min-width:8px}
.tb-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--color-muted);white-space:nowrap;flex:none;padding:0 4px}
.tb-status svg{width:13px;height:13px;color:var(--color-ok)}
@media (max-width:600px){#foot-save{display:none}}
.findbar{display:flex;gap:6px;align-items:center;padding:8px var(--space-3);border-top:1px solid var(--color-border);flex-wrap:wrap}
.findbar .input{min-width:110px;padding:6px 9px}

/* ink */
.ink-float{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:30;display:flex;flex-direction:column;align-items:stretch;gap:4px;max-width:calc(100% - 20px);padding:6px 8px;background:var(--color-surface-raised);border:1px solid var(--color-border-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);animation:floatin .16s var(--ease)}
@keyframes floatin{from{opacity:0;transform:translate(-50%,8px)}}
.ink-float[hidden]{display:none}
.ink-float__row,.ink-float__more{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
.ink-float__more[hidden]{display:none}
.ink-float__row::-webkit-scrollbar,.ink-float__more::-webkit-scrollbar{display:none}
.ink-float__more{border-top:1px solid var(--color-border);padding-top:5px;margin-top:2px}
.ink-float .tbtn{min-width:42px;height:42px}
.ink-float .tbtn svg{width:20px;height:20px}
.ink-float__row [aria-label="More ink tools"] svg{transition:transform .14s}
.ink-float__row [aria-label="More ink tools"][aria-expanded="true"] svg{transform:rotate(90deg)}
.swatches{display:flex;gap:6px;align-items:center;flex:none;padding:0 4px}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--color-surface);box-shadow:0 0 0 1px var(--color-border-strong);flex:none}
.swatch.active{box-shadow:0 0 0 2px var(--color-accent)}
.ink-canvas{display:block;width:100%;height:100%}
.ink-layer{position:absolute;inset:0;z-index:5;pointer-events:none}
.ink-layer[data-active="true"]{pointer-events:auto;cursor:crosshair;touch-action:none}

/* ---------- inspector / sidebar ---------- */
.insp-head{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3);border-bottom:1px solid var(--color-border);flex:none}
.insp-head__label{font-size:12px;font-weight:650;color:var(--color-muted)}
.insp-seg{display:flex;gap:2px;margin-left:auto;background:var(--color-surface-2);border-radius:var(--radius-sm);padding:2px}
.insp-seg button{font-size:12px;font-weight:550;color:var(--color-muted);padding:5px 10px;border-radius:var(--radius-xs)}
.insp-seg button[aria-selected="true"]{background:var(--color-surface);color:var(--color-text);box-shadow:var(--shadow-sm)}
.ctx-tabs{display:flex;gap:2px;border-bottom:1px solid var(--color-border);overflow-x:auto;scrollbar-width:none;flex:none}
.ctx-tab{padding:9px 10px;font-size:12.5px;font-weight:550;color:var(--color-muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.ctx-tab[aria-selected="true"]{color:var(--color-accent);border-color:var(--color-accent)}
.ctx-body{flex:1;min-height:0;overflow-y:auto;padding:var(--space-3)}
.ctx-item{padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md);margin-bottom:8px;background:var(--color-surface)}
.ctx-item__meta{font-size:12px;color:var(--color-muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.ctx-item__text{font-size:13px;margin-top:5px;color:var(--color-text-2)}
.ctx-quote{font-size:12.5px;color:var(--color-muted);font-style:italic;border-left:2px solid var(--color-border-strong);padding-left:8px;margin-top:5px}
.side-h{font-size:12px;font-weight:650;color:var(--color-muted);margin:var(--space-4) 0 var(--space-2)}
.side-h:first-child{margin-top:0}
.insp-selection{background:var(--color-accent-soft);border-radius:var(--radius-md);padding:var(--space-3);margin-bottom:var(--space-3)}
.insp-selection__quote{font-size:13px;color:var(--color-text-2);font-style:italic;margin:6px 0 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.insp-actions{display:flex;flex-wrap:wrap;gap:6px}
.insp-actions button{font-size:12.5px;display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);color:var(--color-text-2);background:var(--color-surface)}
.insp-actions button:hover{color:var(--color-accent);border-color:var(--color-accent)}
.insp-actions svg{width:14px;height:14px}
.side-nav{display:flex;flex-direction:column;gap:1px}
.side-nav button,.side-nav a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--radius-sm);font-size:13px;color:var(--color-text-2);width:100%;overflow:hidden}
.side-nav button:hover,.side-nav a:hover{background:var(--color-surface-2);color:var(--color-text);text-decoration:none}
.side-nav svg{width:15px;height:15px;color:var(--color-muted)}
.sn-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.outline-list{display:flex;flex-direction:column;gap:1px}
.outline-item{text-align:left;padding:6px 8px;border-radius:var(--radius-sm);font-size:13px;color:var(--color-text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.outline-item:hover{background:var(--color-surface-2)}
.outline-item[data-lvl="2"]{padding-left:20px;font-size:12.5px}
.outline-item[data-lvl="3"]{padding-left:32px;font-size:12px;color:var(--color-muted)}

/* selection bar */
.selbar{position:fixed;z-index:55;display:flex;gap:1px;align-items:center;background:var(--color-surface-raised);border:1px solid var(--color-border-strong);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:4px;animation:floatin2 .12s var(--ease)}
@keyframes floatin2{from{opacity:0;transform:translateY(4px)}}
.selbar .tbtn{min-width:34px;height:34px}

/* ---------- settings ---------- */
.settings-grid{display:grid;grid-template-columns:1fr;gap:var(--space-3)}
.setting-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-4)}
.setting-card h3{font-size:14px;font-weight:650;margin-bottom:var(--space-2);display:flex;align-items:center;gap:8px}
.setting-card h3 svg{width:16px;height:16px;color:var(--color-muted)}
.setting-card details{margin-top:var(--space-3);border-top:1px solid var(--color-border);padding-top:var(--space-3)}
.setting-card details>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--color-text-2);list-style:none}
.setting-card details>summary::-webkit-details-marker{display:none}
.setting-card details>summary::before{content:"›";display:inline-block;margin-right:6px;transition:transform .14s}
.setting-card details[open]>summary::before{transform:rotate(90deg)}
.seg{display:inline-flex;background:var(--color-surface-2);border-radius:var(--radius-md);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:550;color:var(--color-muted)}
.seg button[aria-pressed="true"]{background:var(--color-surface);color:var(--color-text);box-shadow:var(--shadow-sm)}
.storage-bar{height:6px;border-radius:3px;background:var(--color-surface-2);overflow:hidden;margin:8px 0}
.storage-bar span{display:block;height:100%;background:var(--color-accent);border-radius:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:10px 0;border-bottom:1px solid var(--color-border);flex-wrap:wrap}
.row:last-child{border-bottom:none}
.row__label{font-size:13.5px;font-weight:550}
.row__sub{font-size:12.5px;color:var(--color-muted)}
.switch{width:44px;height:26px;border-radius:13px;background:var(--color-border-strong);position:relative;flex:none;transition:background .14s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .14s var(--ease);box-shadow:var(--shadow-sm)}
.switch[aria-checked="true"]{background:var(--color-accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* ---------- map / versions / search ---------- */
.map-wrap{position:relative;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface);overflow:auto;height:min(66vh,560px);background-image:radial-gradient(var(--color-border) 1px,transparent 1px);background-size:24px 24px}
.map-canvas{position:relative;min-width:640px;min-height:480px}
.map-node{position:absolute;transform:translate(-50%,-50%);background:var(--color-elevated);border:1.5px solid var(--color-border-strong);border-radius:var(--radius-md);padding:6px 11px;font-size:12px;font-weight:550;box-shadow:var(--shadow-sm);max-width:170px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-node:hover{border-color:var(--color-accent)}
.map-node[data-kind="subject"]{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent)}

.ver-item{display:flex;gap:var(--space-3);padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md);margin-bottom:6px;align-items:center;background:var(--color-surface)}
.ver-time{font-size:12px;color:var(--color-muted);font-variant-numeric:tabular-nums;width:48px;flex:none}
.ver-label{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ver-day{font-size:12px;font-weight:650;color:var(--color-muted);margin:var(--space-4) 0 var(--space-2)}
.ver-day:first-child{margin-top:0}
.search-input-row{display:flex;align-items:center;gap:var(--space-3);background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:var(--space-4)}
.search-input-row:focus-within{border-color:var(--color-accent);box-shadow:var(--glow)}
.search-input-row svg{width:18px;height:18px;color:var(--color-muted)}
.search-input-row input{flex:1;border:none;background:none;outline:none;font-size:15px;min-width:0}
.result-group{margin-bottom:var(--space-5)}
.result-group__h{font-size:12px;font-weight:650;color:var(--color-muted);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.result-group__h .n{background:var(--color-surface-2);border-radius:20px;padding:1px 8px;font-size:11px}
.result{display:flex;gap:var(--space-3);padding:9px 10px;border-radius:var(--radius-md);width:100%;text-align:left}
.result:hover{background:var(--color-surface)}
.result__icon{width:30px;height:30px;border-radius:var(--radius-sm);background:var(--color-surface-2);display:grid;place-items:center;flex:none;color:var(--color-text-2)}
.result__icon svg{width:15px;height:15px}
.result__body{min-width:0;flex:1}
.result__title{font-size:14px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.result__meta{font-size:12px;color:var(--color-muted)}
.result__snip{font-size:13px;color:var(--color-muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qa-list{display:grid;gap:2px}
.qa-item{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;padding:11px 12px;border-radius:var(--radius-md);font-size:14px;min-height:52px}

/* ---------- focus mode ---------- */
body.focus .ws__side,body.focus .ws__ctx{display:none!important}

@media print{

.sb-subj{display:flex;align-items:center;gap:2px;border-radius:var(--radius-md);padding-right:4px}

/* ---------- storage abstraction (IndexedDB primary, localStorage fallback) ---------- */
const STORES = ["subjects","folders","documents","docContent","sources","projects","questions","experiments","claims","annotations","ink","tags","attachments","blobs","versions","links","settings","trash","meta"];

const Storage = (function () {
  let mode = "unknown";      // "idb" | "ls"
  let idb = null;
  const LS_PREFIX = "atelier:";
  const mem = Object.create(null);
  function lsAvailable() { try { localStorage.setItem("atelier:probe", "1"); localStorage.removeItem("atelier:probe"); return true; } catch (e) { return false; } }
  function lsGet(store, key) {
    if (lsAvailable()) { const raw = localStorage.getItem(LS_PREFIX + store + ":" + key); return raw ? JSON.parse(raw) : undefined; }
    return mem[store + ":" + key];
  }
  function lsGetAll(store) {
    if (lsAvailable()) {
      const out = [];
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(LS_PREFIX + store + ":")) out.push(JSON.parse(localStorage.getItem(k))); }
      return out;
    }
    return Object.keys(mem).filter((k) => k.startsWith(store + ":")).map((k) => mem[k]);
  }
  function lsPut(store, val) {
    if (lsAvailable()) { try { localStorage.setItem(LS_PREFIX + store + ":" + val.id, JSON.stringify(val)); return; } catch (e) {} }
    mem[store + ":" + val.id] = val;
  }
  function lsDel(store, key) { if (lsAvailable()) { try { localStorage.removeItem(LS_PREFIX + store + ":" + key); } catch (e) {} } delete mem[store + ":" + key]; }
  function lsClear(store) {
    if (lsAvailable()) { const keys = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(LS_PREFIX + store + ":")) keys.push(k); } keys.forEach((k) => localStorage.removeItem(k)); }
    Object.keys(mem).forEach((k) => { if (k.startsWith(store + ":")) delete mem[k]; });
  }

  function openIDB() {
    return new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open("atelier-db", 1); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        STORES.forEach((s) => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: "id" }); });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error("blocked"));
      setTimeout(() => reject(new Error("timeout")), 4000);
    });
  }

  function tx(store, mode2, fn) {
    return new Promise((resolve, reject) => {
      const t = idb.transaction(store, mode2);
      const os = t.objectStore(store);
      let result;
      try { result = fn(os); } catch (e) { reject(e); return; }
      t.oncomplete = () => resolve(result && result.result !== undefined ? result.result : result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }
  function wrap(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }

  async function init() {
    try { idb = await openIDB(); mode = "idb"; }
    catch (e) { mode = "ls"; idb = null; }
    return mode;
  }
  async function get(store, key) {
    if (mode === "idb") return tx(store, "readonly", (os) => wrap(os.get(key)));
    return lsGet(store, key);
  }
  async function getAll(store) {
    if (mode === "idb") return tx(store, "readonly", (os) => wrap(os.getAll()));
    return lsGetAll(store);
  }
  async function put(store, val) {
    if (mode === "idb") return tx(store, "readwrite", (os) => wrap(os.put(val)));
    lsPut(store, val); return val;
  }
  async function bulkPut(store, vals) {
    if (mode === "idb") return tx(store, "readwrite", (os) => { vals.forEach((v) => os.put(v)); });
    vals.forEach((v) => lsPut(store, v)); return vals;
  }
  async function del(store, key) {
    if (mode === "idb") return tx(store, "readwrite", (os) => wrap(os.delete(key)));
    lsDel(store, key);
  }
  async function bulkDel(store, keys) {
    if (mode === "idb") return tx(store, "readwrite", (os) => { keys.forEach((k) => os.delete(k)); });
    keys.forEach((k) => lsDel(store, k));
  }
  async function clear(store) {
    if (mode === "idb") return tx(store, "readwrite", (os) => wrap(os.clear()));
    lsClear(store);
  }
  async function count(store) {
    if (mode === "idb") return tx(store, "readonly", (os) => wrap(os.count()));
    return lsGetAll(store).length;
  }
  async function clearAll() { for (const s of STORES) await clear(s); }
  return { init, get, getAll, put, bulkPut, del, bulkDel, clear, count, clearAll, get mode() { return mode; } };
})();

/* ---------- overlays: modal / drawer / sheet ---------- */
function openOverlay(opts) {
  const root = $("#overlay-root");
  const ov = el("div", { class: "overlay overlay--" + (opts.placement || "center") });
  let box;
  if (opts.placement === "right" || opts.placement === "left") box = el("div", { class: "drawer" });
  else if (opts.placement === "bottom") box = el("div", { class: "sheet" });
  else box = el("div", { class: "modal" + (opts.wide ? " modal--wide" : "") });

  if (opts.placement === "bottom") box.appendChild(el("div", { class: "sheet__grip" }));

  if (opts.title !== undefined && opts.placement !== "bottom") {
    const head = el("div", { class: "modal__head" });
    head.appendChild(el("h2", { text: opts.title }));
    head.appendChild(el("button", { class: "iconbtn", "aria-label": "Close", html: icon("close"), onClick: close }));
    box.appendChild(head);
  } else if (opts.placement === "bottom") {
    const head = el("div", { class: "modal__head" });
    head.appendChild(el("h2", { text: opts.title || "" }));
    head.appendChild(el("button", { class: "iconbtn", "aria-label": "Close", html: icon("close"), onClick: close }));
    box.appendChild(head);
  }

  const body = el("div", { class: "modal__body" });
  if (typeof opts.content === "string") body.innerHTML = opts.content;
  else if (opts.content) body.appendChild(opts.content);
  box.appendChild(body);

  if (opts.footer) {
    const foot = el("div", { class: "modal__foot" });
    if (typeof opts.footer === "string") foot.innerHTML = opts.footer;
    else foot.appendChild(opts.footer);
    box.appendChild(foot);
  }
  ov.appendChild(box);
  root.appendChild(ov);
  requestAnimationFrame(() => ov.classList.add("open"));

  let closed = false;
  function close() {
    if (closed) return; closed = true;
    ov.classList.remove("open");
    setTimeout(() => ov.remove(), 220);
    document.removeEventListener("keydown", onKey);
    opts.onClose && opts.onClose();
  }
  function onKey(e) { if (e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  ov.addEventListener("mousedown", (e) => { if (e.target === ov) close(); });
  if (opts.focus) setTimeout(() => { const f = body.querySelector(opts.focus); if (f) f.focus(); }, 60);
  return { close, body, el: box, overlay: ov };
}

function openMenu(anchor, items) {

  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = Math.min(r.right - mw, window.innerWidth - mw - 8);
  if (left < 8) left = 8;
  let top = r.bottom + 6;
  if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  menu.style.left = left + "px";
  menu.style.top = top + "px";
  menu.dataset.open = "1";
  setTimeout(() => {
    document.addEventListener("mousedown", onDoc, true);
    document.addEventListener("touchstart", onDoc, true);
    window.addEventListener("scroll", onScroll, true);
    window.addEventListener("resize", closeMenu);
  }, 0);
  function onDoc(e) { if (!menu.contains(e.target)) closeMenu(); }
  function onScroll(e) { if (!menu.contains(e.target)) closeMenu(); }
  function cleanup() {
    document.removeEventListener("mousedown", onDoc, true);
    document.removeEventListener("touchstart", onDoc, true);
    window.removeEventListener("scroll", onScroll, true);
    window.removeEventListener("resize", closeMenu);
  }
  menu._cleanup = cleanup;
  return menu;
}

/* ---------- sanitize pasted/imported HTML ---------- */
const ALLOWED_TAGS = new Set(["P","DIV","BR","H1","H2","H3","H4","H5","H6","STRONG","B","EM","I","U","S","STRIKE","DEL","MARK","SPAN","UL","OL","LI","BLOCKQUOTE","PRE","CODE","TABLE","THEAD","TBODY","TR","TH","TD","A","IMG","HR","FIGURE","FIGCAPTION","SUP","SUB","FONT","INPUT"]);
function sanitizeHtml(html) {
  const tpl = document.createElement("div");
  tpl.innerHTML = html;
  tpl.querySelectorAll("script,style,iframe,object,embed,link,meta,form").forEach((n) => n.remove());
  tpl.querySelectorAll("*").forEach((n) => {
    if (!ALLOWED_TAGS.has(n.tagName)) { // unwrap unknown
      const parent = n.parentNode;
      while (n.firstChild) parent.insertBefore(n.firstChild, n);
      parent.removeChild(n); return;
    }
    Array.from(n.attributes).forEach((a) => {
      const name = a.name.toLowerCase();
      if (name.startsWith("on")) n.removeAttribute(a.name);
      if ((name === "href" || name === "src") && /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name);
      if (name === "style" && /expression|javascript:/i.test(a.value)) n.removeAttribute(a.name);
    });
  });
  return tpl.innerHTML;
}

function htmlToText(html) {
  const d = document.createElement("div"); d.innerHTML = html || "";
  d.querySelectorAll(".rb__label").forEach((n) => n.remove());
  d.querySelectorAll("br").forEach((n) => n.replaceWith(document.createTextNode(" ")));
  d.querySelectorAll("p,div,h1,h2,h3,h4,h5,h6,li,blockquote,pre,tr,figcaption,section,article").forEach((n) => {
    if (n.parentNode) n.parentNode.insertBefore(document.createTextNode(" "), n.nextSibling);
  });
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}

function backlinksFor(kind, id) {
  const out = [];
  State.links.forEach((l) => {
    if (l.toType === kind && l.toId === id) out.push({ via: l, from: resolveRef(l.fromType, l.fromId) });
    else if (l.fromType === kind && l.fromId === id) out.push({ via: l, from: resolveRef(l.toType, l.toId) });
  });
  return out.filter((x) => x.from);
}
function resolveRef(type, id) {
  if (type === "doc") { const d = docById(id); return d ? { type, id, title: d.title, subjectId: d.subjectId } : null; }
  if (type === "source") { const s = sourceById(id); return s ? { type, id, title: s.title, subjectId: s.subjectId } : null; }

  if (type === "subject") { const s = subjectById(id); return s ? { type, id, title: s.name } : null; }
  return null;
}

/* ---------- global search ---------- */
async function globalSearch(query) {
  query = (query || "").trim(); if (!query) return null;
  const q = query.toLowerCase();
  const hit = (s) => s && s.toLowerCase().includes(q);
  const groups = { documents: [], subjects: [], notes: [], sources: [], annotations: [], experiments: [], questions: [], tags: [], attachments: [], ink: [] };

  State.subjects.forEach((s) => { if (hit(s.name) || hit(s.description)) groups.subjects.push({ id: s.id, title: s.name, sub: (s.description || "Subject"), type: "subject" }); });
  const contents = await Storage.getAll("docContent");
  const cmap = {}; contents.forEach((c) => cmap[c.id] = c);
  State.documents.forEach((d) => {
    const c = cmap[d.id] || {};
    const inTitle = hit(d.title), inBody = hit(c.plain || "");
    if (inTitle || inBody) {
      let snip = "";
      if (inBody) { const i = (c.plain || "").toLowerCase().indexOf(q); snip = (c.plain || "").slice(Math.max(0, i - 40), i + 90); }
      const isNote = d.type === "note";
      (isNote ? groups.notes : groups.documents).push({ id: d.id, title: d.title, sub: subjectById(d.subjectId) ? subjectById(d.subjectId).name : "", snip, type: "doc", kind: d.type });
    }
  });
  State.sources.forEach((s) => { if (hit(s.title) || hit(s.authors) || hit(s.notes) || (s.tags || []).some(hit)) groups.sources.push({ id: s.id, title: s.title, sub: [s.authors, s.date].filter(Boolean).join(" · "), snip: s.notes, type: "source" }); });
  State.annotations.forEach((a) => { if (hit(a.text) || hit(a.quote)) { const d = docById(a.docId); groups.annotations.push({ id: a.id, docId: a.docId, title: truncate(a.text || a.quote, 60), sub: d ? d.title : "Annotation", snip: a.quote, type: "annotation", kind: a.type }); } });
  State.experiments.forEach((e) => { const blob = Object.values(e.fields || {}).join(" "); if (hit(e.title) || hit(blob)) groups.experiments.push({ id: e.id, title: e.title, sub: subjectById(e.subjectId) ? subjectById(e.subjectId).name : "", type: "experiment" }); });
  State.questions.forEach((x) => { if (hit(x.text)) groups.questions.push({ id: x.id, title: x.text, sub: subjectById(x.subjectId) ? subjectById(x.subjectId).name : "", type: "question" }); });
  State.tags.forEach((t) => { if (hit(t.name)) groups.tags.push({ id: t.id, title: "#" + t.name, sub: "Tag", type: "tag" }); });
  State.attachments.forEach((a) => { if (hit(a.name)) groups.attachments.push({ id: a.id, title: a.name, sub: fmtBytes(a.size), type: "attachment" }); });
  const inks = await Storage.getAll("ink");
  inks.forEach((rec) => { if (rec.ocrText && hit(rec.ocrText)) { const d = docById(rec.id); groups.ink.push({ id: rec.id, title: truncate(rec.ocrText, 60), sub: d ? d.title : "Ink", type: "ink" }); } });

  return { query, groups };
}

/* ---------- export / import library ---------- */
async function exportLibrary() {
  const data = { app: "atelier", version: 1, exportedAt: new Date().toISOString(), settings: State.settings };
  for (const store of STORES) {
    if (store === "settings" || store === "meta" || store === "blobs") continue;
    data[store] = await Storage.getAll(store);
  }
  const blobs = await Storage.getAll("blobs");
  data.blobs = [];
  for (const b of blobs) {
    if (b.blob) { const url = await blobToDataURL(b.blob); data.blobs.push({ id: b.id, data: url, type: b.blob.type, name: b.blob.name || "" }); }
  }
  return new Blob([JSON.stringify(data)], { type: "application/json" });
}
function blobToDataURL(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); }); }
async function dataURLToBlob(url) { const r = await fetch(url); return r.blob(); }

async function importLibrary(text, mode) {
  const data = JSON.parse(text);
  if (!data || data.app !== "atelier") throw new Error("Not an Atelier library file");
  if (mode === "replace") await Storage.clearAll();
  for (const store of STORES) {
    if (store === "settings" || store === "meta" || store === "blobs") continue;
    if (Array.isArray(data[store])) await Storage.bulkPut(store, data[store]);
  }
  if (Array.isArray(data.blobs)) {
    for (const b of data.blobs) {
      if (b.id && b.data) { try { const blob = await dataURLToBlob(b.data); await Storage.put("blobs", { id: b.id, blob }); } catch (e) {} }
    }
  }
  if (data.settings && mode === "replace") { Object.assign(State.settings, data.settings); await saveSettings(); }
  await Storage.put("meta", { id: "seeded", at: Date.now(), version: 1 });
  await loadLibrary();
  return data;
}

async function addGalleryImages(files) {
  const list = Array.from(files || []).filter((f) => /^image\//.test(f.type));

  let order = galleryItems().reduce((m, a) => Math.max(m, a.order || 0), -1);

    await createAttachment({ gallery: true, caption: f.name.replace(/\.[^.]+$/, ""), order, name: f.name, type: f.type }, f);

  if (added) { toast(added + " image" + (added > 1 ? "s" : "") + " added", { kind: "ok" }); rerender(); }

/* ==== subject.js ==== */
/* ============================================================

const SUBJECT_TABS = ["overview", "notes", "research", "projects", "experiments", "sources", "attachments"];

function renderSubjectPage(subjectId, tab) {
  const s = subjectById(subjectId);
  if (!s) { Router.go("#/home"); return; }
  State.current.subjectId = subjectId;
  tab = SUBJECT_TABS.includes(tab) ? tab : "overview";
  State.current.tab = tab;

  const wrap = el("div", { class: "page" });

  const head = el("div", { class: "subject-head" });
  const ic = el("span", { class: "subject-head__icon", html: icon(s.icon || "book") });
  if (s.color) { ic.style.color = s.color; ic.style.background = "color-mix(in srgb," + s.color + " 14%,transparent)"; }
  head.appendChild(ic);
  const hb = el("div", { style: "min-width:0;flex:1" });
  hb.appendChild(el("h1", { text: s.name }));
  if (s.description) hb.appendChild(el("p", { text: s.description }));
  head.appendChild(hb);
  const menuBtn = el("button", { class: "iconbtn", "aria-label": "Subject options", html: icon("more") });
  menuBtn.addEventListener("click", () => openSubjectMenu(menuBtn, s));
  head.appendChild(menuBtn);
  wrap.appendChild(head);

  const tabs = el("div", { class: "tabs", role: "tablist", style: "margin-top:14px" });
  SUBJECT_TABS.forEach((t) => {
    const b = el("button", { class: "tab", role: "tab", "aria-selected": String(t === tab), text: t.charAt(0).toUpperCase() + t.slice(1) });
    b.addEventListener("click", () => Router.go("#/subject/" + subjectId + "/" + t));
    tabs.appendChild(b);
  });
  wrap.appendChild(tabs);

  const body = el("div", { style: "margin-top:20px" });
  wrap.appendChild(body);
  ({ overview: renderOverview, notes: renderNotesTab, research: renderResearchTab, projects: renderProjectsTab, experiments: renderExperimentsTab, sources: renderSourcesTab, attachments: renderAttachmentsTab }[tab])(body, s);

  setMain(wrap);
}

/* ---------- Overview ---------- */
function renderOverview(root, s) {
  const stats = el("div", { class: "stat-grid" });
  const docs = docsOfSubject(s.id), srcs = sourcesOfSubject(s.id), exps = experimentsOfSubject(s.id), qs = questionsOfSubject(s.id);
  [["Documents", docs.length], ["Sources", srcs.length], ["Experiments", exps.length], ["Open questions", qs.filter((q) => !q.done).length]]
    .forEach(([l, n]) => stats.appendChild(el("div", { class: "stat" }, [el("div", { class: "stat__n", text: String(n) }), el("div", { class: "stat__l", text: l })])));
  root.appendChild(stats);

  const recentDocs = docs.slice().sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 4);
  root.appendChild(sectionHead("Recent documents", { label: "New note", onClick: () => newDocument(s.id, "note") }));
  if (!recentDocs.length) root.appendChild(el("div", { class: "empty empty--inline", text: "No documents yet." }));
  else { const l = el("div", { class: "list" }); recentDocs.forEach((d) => l.appendChild(docRow(d))); root.appendChild(l); }

  const activeProjects = projectsOfSubject(s.id).filter((p) => p.status !== "archived").slice(0, 3);
  if (activeProjects.length) {
    root.appendChild(sectionHead("Active projects"));
    const l = el("div", { class: "list" }); activeProjects.forEach((p) => l.appendChild(projectRow(p))); root.appendChild(l);
  }

  const openQs = qs.filter((q) => !q.done).slice(0, 5);

    root.appendChild(sectionHead("Open research questions", { label: "Manage", onClick: () => Router.go("#/subject/" + s.id + "/research") }));
    const l = el("div"); openQs.forEach((q) => l.appendChild(questionItem(q, s))); root.appendChild(l);
  }

  const recentExps = exps.slice().sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 3);
  if (recentExps.length) {
    root.appendChild(sectionHead("Recent experiments", { label: "New", onClick: () => newExperiment(s.id) }));
    const l = el("div", { class: "list" }); recentExps.forEach((e) => l.appendChild(experimentRow(e))); root.appendChild(l);
  }

  }
}

/* ---------- Notes ---------- */
function renderNotesTab(root, s) {

/* ---------- Research ---------- */
function renderResearchTab(root, s) {

function questionItem(q, s) {
  const item = el("div", { class: "q-item", dataset: { done: String(q.done) } });
  const chk = el("button", { class: "q-check", "aria-label": q.done ? "Mark open" : "Mark answered", html: icon("check"), onClick: async (e) => { e.stopPropagation(); await updateQuestion(q.id, { done: !q.done }); rerender(); } });
  item.appendChild(chk);
  const body = el("div", { style: "flex:1;min-width:0" });
  const text = el("button", { class: "q-text", style: "text-align:left;background:none;border:none;padding:0;color:inherit", text: q.text });
  text.addEventListener("click", () => openQuestionDetail(q));
  body.appendChild(text);
  const rel = [];
  if (q.links) { if (q.links.docs.length) rel.push(q.links.docs.length + " notes"); if (q.links.sources.length) rel.push(q.links.sources.length + " sources"); if (q.links.experiments.length) rel.push(q.links.experiments.length + " experiments"); }
  if (rel.length) body.appendChild(el("div", { class: "q-rel", html: rel.map(escapeHtml).join("<span></span>") }));
  item.appendChild(body);
  const m = el("button", { class: "iconbtn", "aria-label": "Question options", html: icon("more") });
  m.addEventListener("click", (e) => { e.stopPropagation(); openMenu(m, [
    { label: "Open", icon: "chevron", onClick: () => openQuestionDetail(q) },
    { label: "Edit", icon: "edit", onClick: async () => { const v = await promptDialog({ title: "Edit question", value: q.text }); if (v) { await updateQuestion(q.id, { text: v }); rerender(); } } },
    { label: "Delete", icon: "trash", danger: true, onClick: async () => { if (await confirmDialog("Delete this question?")) { await deleteQuestion(q.id); rerender(); } } },
  ]); });
  item.appendChild(m);
  return item;
}

function openQuestionDetail(q) {
  const wrap = el("div");
  wrap.appendChild(el("p", { style: "font-size:15px;font-weight:560;margin-bottom:14px", text: q.text }));
  const relDocs = (q.links && q.links.docs || []).map(docById).filter(Boolean);
  const relSrcs = (q.links && q.links.sources || []).map(sourceById).filter(Boolean);
  const relExps = (q.links && q.links.experiments || []).map((id) => State.experiments.find((e) => e.id === id)).filter(Boolean);
  const anns = State.annotations.filter((a) => a.quote && q.text && a.quote.toLowerCase().includes(q.text.toLowerCase().slice(0, 12)));
  const groups = [["Notes", relDocs, "doc"], ["Sources", relSrcs, "book"], ["Experiments", relExps, "flask"], ["Related annotations", anns, "comment"]];
  let any = false;
  groups.forEach(([label, items, ic]) => {
    if (!items.length) return; any = true;
    wrap.appendChild(el("div", { class: "side-h", text: label }));
    items.forEach((it) => {
      const row = el("button", { class: "docrow", onClick: () => { dlg.close(); if (it.title !== undefined && it.docId !== undefined) openDoc(it.docId); else if (it.title !== undefined && it.fields) Router.go("#/experiment/" + it.id); else if (it.url !== undefined) Router.go("#/subject/" + it.subjectId + "/sources"); else if (it.docId) openDoc(it.docId); } });
      row.innerHTML = '<span class="docrow__icon">' + icon(ic) + '</span><span class="docrow__body"><span class="docrow__title">' + escapeHtml(it.title || it.text || "Item") + "</span></span>";
      wrap.appendChild(row);
    });
  });
  if (!any) wrap.appendChild(el("p", { class: "hint", text: "No linked notes, sources, experiments or evidence yet. Link them while writing." }));
  const foot = el("div", { style: "display:flex;gap:8px;justify-content:flex-end" });
  foot.appendChild(el("button", { class: "btn", text: "Close", onClick: () => dlg.close() }));
  const dlg = openOverlay({ title: "Research question", content: wrap, footer: foot });
}

function questionDialog(existing, subjectId) {

function renderExperimentPage(id) {
  const e = State.experiments.find((x) => x.id === id);

  wrap.appendChild(head);

/* ---------- Sources ---------- */
function renderSourcesTab(root, s) {
  root.appendChild(sectionHead("Sources", { label: "Add source", onClick: () => sourceDialog(null, s.id) }));
  const srcs = sourcesOfSubject(s.id);
  if (!srcs.length) root.appendChild(emptyState("Add a research source", "Track papers, books, websites, datasets and documentation.", "book", "Add source", () => sourceDialog(null, s.id)));
  else {
    const tagFilter = new Set();
    const filterRow = el("div", { class: "tag-row", style: "margin-bottom:14px" });
    const allTags = Array.from(new Set(srcs.flatMap((x) => x.tags || [])));
    allTags.forEach((t) => {
      const c = el("button", { class: "chip", text: "#" + t });
      c.addEventListener("click", () => { if (tagFilter.has(t)) tagFilter.delete(t); else tagFilter.add(t); c.classList.toggle("chip--accent"); renderList(); });
      filterRow.appendChild(c);
    });
    if (allTags.length) root.appendChild(filterRow);
    const listWrap = el("div", { style: "display:grid;gap:10px" });
    function renderList() {
      listWrap.innerHTML = "";
      let list = srcs;
      if (tagFilter.size) list = srcs.filter((x) => (x.tags || []).some((t) => tagFilter.has(t)));
      if (!list.length) listWrap.appendChild(el("div", { class: "empty empty--inline", text: "No sources match the selected tags." }));
      list.forEach((x) => listWrap.appendChild(sourceCard(x)));
    }
    renderList();
    root.appendChild(listWrap);
  }
}

function sourceCard(src) {
  const typeIcon = { website: "link", paper: "book", book: "book", pdf: "doc", documentation: "code", video: "image", dataset: "layers" }[src.type] || "book";
  const card = el("div", { class: "src-card" });
  card.appendChild(el("span", { class: "src-card__icon", html: icon(typeIcon) }));
  const body = el("div", { class: "src-card__body" });
  body.appendChild(el("div", { class: "src-card__title", text: src.title }));
  const sub = [src.authors, src.publication, src.date].filter(Boolean).join(" · ");
  if (sub) body.appendChild(el("div", { class: "src-card__sub", text: sub }));
  if (src.notes) body.appendChild(el("div", { class: "src-card__notes", text: src.notes }));
  if (src.url) { const a = el("a", { href: src.url, target: "_blank", rel: "noopener", style: "font-size:12.5px;word-break:break-all", text: src.url }); body.appendChild(a); }
